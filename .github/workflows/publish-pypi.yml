name: Publish to PyPI

on:
  push:
    branches: [main]
    paths: [pyproject.toml]

permissions:
  contents: read

jobs:
  version:
    name: Detect a version bump
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --locked --dev
      - name: Compare versions across this push
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: uv run --locked python scripts/release.py detect --before "$BEFORE_SHA"

  tests:
    name: Release quality gates
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/quality.yml

  build:
    name: Build release distributions
    needs: [version, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"
          enable-cache: true
          python-version: "3.11"
      - run: uv build
      - name: Validate release artifacts
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: uv run --locked python scripts/release.py artifacts --version "$RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish with PyPI trusted publishing
    needs: [version, build]
    if: github.repository == 'mylonasc/synirmos' && github.ref == 'refs/heads/main' && needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pypi-synirmos-${{ needs.version.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist/
      - name: Upload tested distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
